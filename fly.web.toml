# The web app on Fly.io, Mumbai: the nginx image serving the Vite build and proxying /api to
# the API app over Fly's private network, so the browser stays same-origin and holds no key.
#
#   fly deploy -c fly.web.toml
#
# Fly's private DNS lives at [fdaa::3] and is IPv6-only, hence the resolver settings.

app = "dhan-sarthi-web"
primary_region = "bom"

[build]
  dockerfile = "apps/web/Dockerfile"
  [build.args]
    # The public review link keeps the badged offline chunk; the bank artefact sets this false.
    VITE_OFFLINE_FALLBACK = "true"

[env]
  API_UPSTREAM = "http://dhan-sarthi-api.internal:3001"
  DNS_RESOLVER = "[fdaa::3]"
  RESOLVER_FLAGS = ""

[http_service]
  internal_port = 80
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "3s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
