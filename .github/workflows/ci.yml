name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: lint · format · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        # Version comes from the packageManager field in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Formatting
        run: pnpm format:check

      - name: Typecheck every workspace
        run: pnpm typecheck

      - name: Build packages, then run every test
        run: pnpm test

      - name: Build the apps
        run: pnpm -r --filter './apps/*' build

  hygiene:
    name: secrets · env files · dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Refuse committed secrets or environment files
        run: |
          set -e
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -v '\.example$'; then
            echo "an environment file is tracked"; exit 1; fi
          if git grep -nE 'key_[0-9a-f]{40,}|sk-[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|postgres(ql)?://[^:/]+:[^@/]+@' -- . ':!.github/workflows/ci.yml' ':!.env.example'; then
            echo "a credential-shaped string is tracked"; exit 1; fi

      - name: Audit production dependencies
        # High and critical advisories fail the build; lower ones are reported in the log.
        run: pnpm audit --prod --audit-level=high
