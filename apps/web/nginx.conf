# nginx for the compose stack only. Serves the Vite build as a single-page app and proxies
# /api to the api service. In AWS CloudFront plays this role (cdn.tf).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compose's embedded DNS. Resolving at request time (via the variable below) means nginx
    # starts even if the api container is still coming up, instead of failing config load.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        set $api http://api:3001;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API's own request timeout is 10 s; the avatar grant can legitimately take ~15 s.
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    # Vite emits content-hashed filenames under /assets, so they can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # History fallback: every unknown path is the app shell, which must never be cached so a
    # deploy is picked up on the next load.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
